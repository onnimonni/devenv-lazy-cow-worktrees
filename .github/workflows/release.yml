name: Release

on:
  push:
    tags: ["v*"]
  # Builds and packages without publishing, to check a change to this workflow.
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # No ubuntu-latest-arm label: https://github.com/orgs/community/discussions/148648
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Static OpenSSL: the binary runs without Nix or Homebrew.
      - run: cargo build --release --locked --features vendored-openssl --target ${{ matrix.target }}
      - name: Package
        run: |
          name=lazy-cow-tree-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/lazy-cow-tree target/${{ matrix.target }}/release/lazy-cow-tree-cow README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          tar tzf "$name.tar.gz"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lazy-cow-tree-*.tar.gz
            lazy-cow-tree-*.tar.gz.sha256
          generate_release_notes: true
