name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Static OpenSSL: the binary runs without Nix or Homebrew.
      - run: cargo build --release --locked --features vendored-openssl --target ${{ matrix.target }}
      - name: Package
        run: |
          name=lazy-cow-tree-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/lazy-cow-tree README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            lazy-cow-tree-*.tar.gz
            lazy-cow-tree-*.tar.gz.sha256
          generate_release_notes: true
