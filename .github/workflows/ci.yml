name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  statix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The statix the git hook runs (devenv.lock), its release binary; shellcheck and
      # ruff for the scripts in Nix strings.
      - run: |
          rev=$(jq -r .nodes.statix.locked.rev devenv.lock)
          nix shell "github:onnimonni/statix/$rev#prebuilt" nixpkgs#shellcheck nixpkgs#ruff \
            --command statix check .

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      # PostgreSQL 18, Redis and jq from nixpkgs; git, curl and python3 from the runner.
      - run: nix shell nixpkgs#postgresql_18 nixpkgs#redis nixpkgs#jq --command tests/e2e.sh target/debug/lazy-cow-tree

  nix:
    strategy:
      fail-fast: false
      matrix:
        # One native build per system, each pushed to the cache: aarch64-darwin,
        # x86_64-linux, aarch64-linux. (nixpkgs-unstable dropped x86_64-darwin.)
        # No ubuntu-latest-arm label: https://github.com/orgs/community/discussions/148648
        os: [macos-latest, ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Pushes what it builds to lazy-cow-tree.cachix.org, where the devenv module's
      # default package comes from; pull-only without the token (fork PRs).
      - uses: cachix/cachix-action@v17
        with:
          name: lazy-cow-tree
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .#lazy-cow-tree -L
      - run: ./result/bin/lazy-cow-tree --version && ./result/bin/lazy-cow-tree-cow --version
      # Release binaries (prebuilt.json): Linux ones need patchelf to run.
      - run: nix build .#prebuilt -L -o prebuilt && ./prebuilt/bin/lazy-cow-tree --version
